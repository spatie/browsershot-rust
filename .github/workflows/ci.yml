name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  RUST_TEST_THREADS: 2

jobs:
  test:
    name: Stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Preserve the macOS app bundle extension
        if: runner.os == 'macOS'
        id: mac-chrome
        shell: bash
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          bundle="${CHROME_EXECUTABLE%/Contents/MacOS/*}"
          mv "$bundle" "$bundle.app"
          echo "path=$bundle.app/Contents/MacOS/${CHROME_EXECUTABLE##*/}" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
        env:
          CHROME_PATH: ${{ steps.mac-chrome.outputs.path || steps.chrome.outputs.chrome-path }}
      - run: cargo test --locked --doc --all-features
      - run: cargo doc --locked --no-deps --all-features
      - run: cargo package --locked --allow-dirty

  msrv:
    name: MSRV / 1.89.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.89.0 test --locked --all-targets --all-features
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: cargo +1.89.0 test --locked --doc --all-features

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
