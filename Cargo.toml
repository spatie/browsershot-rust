[package]
name = "spatie-browsershot"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
authors = ["Freek Van der Herten <freek@spatie.be>"]
description = "Convert HTML to an image, PDF or string"
license = "MIT"
repository = "https://github.com/spatie/browsershot-rust"
documentation = "https://spatie.be/docs/browsershot-rust/v1/introduction"
homepage = "https://spatie.be/docs/browsershot-rust"
readme = "README.md"
keywords = ["spatie", "chrome", "pdf", "screenshot", "devtools"]
categories = ["web-programming", "multimedia::images"]
include = ["/src/", "/tests/*.rs", "/build.rs", "/docs/", "/README.md", "/LICENSE.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/Cargo.lock"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
ureq = { version = "3", features = ["json"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
html-escape = "0.2"
regex = "1"

[target.'cfg(unix)'.dependencies]
command-fds = "0.3"

[target.'cfg(windows)'.dependencies]
interprocess = "2.4"

[dev-dependencies]
tiny_http = "0.12"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
strip = true
